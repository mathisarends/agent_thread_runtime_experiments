[project]
name = "agent-protocol"
version = "0.1.0"
description = "Pydantic wire contracts for the agent thread runtime"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_protocol"]

[tool.pytest.ini_options]
addopts = "--cov=agent_protocol --cov-report=term-missing"

[tool.coverage.run]
source = ["src/agent_protocol"]
