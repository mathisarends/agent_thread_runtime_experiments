[project]
name = "gateway"
version = "0.1.0"
description = "Transport-independent agent thread runtime gateway"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dishka>=1.6",
    "fastapi>=0.116.1",
    "py-llmify[openai]>=0.10.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.24",
    "uvicorn>=0.35.0",
]

[project.scripts]
gateway = "gateway.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
addopts = "--cov=gateway --cov-report=term-missing"

[tool.coverage.run]
source = ["src/gateway"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
]
