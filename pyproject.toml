[project]
name = "agent-thread-runtime-experiments"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "agent-cli",
    "agent-protocol",
    "gateway",
    "httpx>=0.28.1",
    "pre-commit>=4.0.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.4",
    "mypy>=1.14.1",
    "pytest-cov>=7.1.0",
]

[tool.uv.workspace]
members = ["cli", "gateway", "protocol"]

[tool.uv.sources]
agent-cli = { workspace = true }
agent-protocol = { workspace = true }
gateway = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = ["llmify", "llmify.*"]
ignore_missing_imports = true
