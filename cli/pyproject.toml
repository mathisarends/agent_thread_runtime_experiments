[project]
name = "agent-cli"
version = "0.1.0"
description = "Interactive terminal client for the agent thread runtime gateway"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "websockets>=15.0.1",
]

[project.scripts]
agent-cli = "agent_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_cli"]

[tool.pytest.ini_options]
addopts = "--cov=agent_cli --cov-report=term-missing"

[tool.coverage.run]
source = ["src/agent_cli"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
]
